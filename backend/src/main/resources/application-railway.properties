# Configuración para Railway PostgreSQL (base remota)
spring.application.name=api

# Base de datos PostgreSQL en Railway (desde .env)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Configuración de HikariCP
# CLAVE PARA APK/PRODUCCIÓN: Railway cierra las conexiones ociosas del Postgres.
# Sin keepalive/max-lifetime, el pool entregaba una conexión MUERTA en el primer
# request tras inactividad -> ese request fallaba y recién el 2º andaba
# (el clásico "siempre 2 clicks"). Con esta config el pool nunca sirve una
# conexión vencida y las mantiene vivas con pings periódicos.
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
# max-lifetime: reciclar conexiones ANTES de que Railway las cierre (~5-10 min).
spring.datasource.hikari.max-lifetime=180000
# keepalive-time: pingear conexiones ociosas para que no mueran (debe ser < max-lifetime).
spring.datasource.hikari.keepalive-time=60000
# idle-timeout: cerrar conexiones ociosas sobrantes por encima de minimum-idle.
spring.datasource.hikari.idle-timeout=120000
# validation-timeout: cuánto esperar a que SELECT 1 valide la conexión al pedirla.
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1

# Configuración de JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuración de Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
