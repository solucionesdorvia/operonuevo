# Configuración local con H2 (base de datos en memoria)
spring.application.name=api

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:opero
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuración de JPA e Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Ejecutar data.sql DESPUÉS de que Hibernate cree las tablas
spring.jpa.defer-datasource-initialization=true

# Habilitar H2 Console para desarrollo
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuración de Swagger/OpenAPI (perfil local)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
