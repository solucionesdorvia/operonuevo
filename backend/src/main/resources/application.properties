spring.application.name=api

# Activar perfil de Railway PostgreSQL
spring.profiles.active=railway

# Permitir conexiones desde la red local (para desarrollo móvil)
# 0.0.0.0 significa escuchar en TODAS las interfaces de red
# IMPORTANTE: En producción, configurar esto correctamente por seguridad
server.address=0.0.0.0

# Límite de subida de archivos (fotos de incidencias).
# El default de Spring es 1MB, insuficiente para fotos de cámara, lo que
# hacía fallar el upload (MaxUploadSizeExceeded -> 401 engañoso).
# Lo alineamos con el tope que valida FileController (10MB).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Configuración de Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# Configuración de JWT
# IMPORTANTE: En producción, este secret debe ser una variable de entorno
# y NO estar hardcodeado en el código. Debe ser un string largo y aleatorio.
jwt.secret=OperoSecretKeyForJWTTokens2026UadeDesarrolloDeAplicacionesSeguridad