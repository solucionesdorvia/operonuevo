# Configuración para pruebas unitarias
spring.application.name=api-test

# Base de datos H2 en memoria para tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate para H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Desactivar Swagger en tests
springdoc.swagger-ui.enabled=false

# JWT para tests
jwt.secret=TestSecretKeyForJWTTokensInUnitTests2026

# Logging mínimo
logging.level.root=ERROR
logging.level.com.opero=INFO
